<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Property Information Form | Stephanie Macnab Estate Agent</title>
  <style>
    :root{
      --brand-yellow:#E1BE4A;
      --brand-gold-dark:#C9A227;
      --brand-slate:#2F3542;
      --brand-slate-dark:#2F3542;
      --brand-white:#ffffff;
      --brand-off:#f4f5f6;
      --brand-line:#d7dbde;
      --ok:#0f7b46;
      --warn:#8a5a00;
      --danger:#8b1e1e;
      --shadow:0 18px 36px rgba(0,0,0,.11);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:Lato, Arial, Helvetica, sans-serif;
      background:#eef1f3;
      color:#1d2328;
    }
    a{color:var(--brand-slate)}
    .page{
      min-height:100vh;
      padding:18px 12px 42px;
      background:
        linear-gradient(180deg, #2F3542 0 335px, #eef1f3 335px 100%);
    }
    .shell{max-width:780px;margin:0 auto}
    .brand{
      text-align:center;
      color:#ffffff;
      padding:8px 12px 20px;
    }
    .brand .logo{
      width:min(125px,38vw);
      display:block;
      margin:8px auto 16px;
      height:auto;
    }
    .brand h1{
      margin:0 0 8px;
      font-family:"Big Caslon", "Big Caslon Medium", Georgia, "Times New Roman", serif;
      font-size:clamp(2rem, 2vw + 1.2rem, 2.7rem);
      font-weight:500;
      line-height:1.02;
      letter-spacing:.01em;
      color:#ffffff;
      text-shadow:0 2px 6px rgba(0,0,0,.22);
      text-align:center;
    }
    .brand p{
      margin:0 auto;
      max-width:680px;
      color:rgba(255,255,255,.92);
      line-height:1.42;
      font-size:1rem;
      text-shadow:0 1px 4px rgba(0,0,0,.18);
      text-align:center;
      padding:0 16px;
    }
    .brand.compact h1,
    .brand.compact p{
      display:none;
    }
    .card{
      background:#fff;
      border-radius:24px;
      box-shadow:var(--shadow);
      overflow:hidden;
      border:1px solid rgba(0,0,0,.04);
    }
    .topbar{
      background:linear-gradient(180deg, #E6C65A 0%, #D4AF37 100%);
      padding:14px 18px;
      display:flex;
      align-items:center;
      gap:12px;
      justify-content:space-between;
      color:#2b2f38;
      font-weight:700;
      font-size:.96rem;
      border-bottom:1px solid rgba(0,0,0,.05);
    }
    .progress{
      height:10px;
      background:rgba(0,0,0,.12);
      border-radius:999px;
      overflow:hidden;
      flex:1;
      min-width:120px;
    }
    .progress > span{
      display:block;
      width:0%;
      height:100%;
      background:#BFA03A;
      transition:width .2s ease;
    }
    .content{padding:22px 18px 20px}
    .eyebrow{
      display:inline-block;
      margin-bottom:14px;
      padding:7px 10px;
      border-radius:999px;
      background:#f0f2f4;
      color:var(--brand-slate);
      font-size:.82rem;
      font-weight:700;
      letter-spacing:.01em;
    }
    h2{
      margin:0 0 12px;
      font-family:"Big Caslon", "Big Caslon Medium", Georgia, "Times New Roman", serif;
      font-size:clamp(1.7rem, 1vw + 1.15rem, 2.15rem);
      line-height:1.12;
      font-weight:500;
      color:#1a2025;
    }
    h3{margin:0 0 10px;color:#1d2328}
    p{
      margin:0 0 12px;
      color:#313840;
      line-height:1.58;
    }
    .small{
      font-size:.92rem;
      color:#5e6872;
    }
    .tiny{
      font-size:.82rem;
      color:#67727c;
      line-height:1.5;
    }
    .stack{display:grid;gap:12px}
    .btn-grid{display:grid;gap:10px;margin-top:14px}
    .btn{
      appearance:none;
      border:1px solid var(--brand-line);
      border-radius:16px;
      background:#fff;
      color:#1f252b;
      font:inherit;
      font-size:1rem;
      line-height:1.35;
      padding:15px 14px;
      width:100%;
      cursor:pointer;
      text-align:left;
      transition:transform .06s ease, box-shadow .15s ease, border-color .2s ease, background .2s ease;
    }
    .btn:hover{box-shadow:0 8px 18px rgba(0,0,0,.06)}
    .btn:active{transform:translateY(1px)}
    .btn.primary{
      background:linear-gradient(180deg, #E6C65A 0%, #D4AF37 100%);
      border-color:#D4AF37;
      color:#2b2f38;
      font-weight:700;
    }
    .btn.secondary{
      background:var(--brand-slate);
      border-color:var(--brand-slate);
      color:#fff;
      font-weight:700;
    }
    .btn.ghost{
      background:#fff;
      color:var(--brand-slate);
    }
    .btn:disabled{
      opacity:.45;
      cursor:not-allowed;
      box-shadow:none;
    }
    .field{display:grid;gap:7px;margin-top:10px}
    label{
      font-size:.93rem;
      font-weight:700;
      color:#273038;
    }
    input[type="text"], input[type="email"], textarea, select{
      width:100%;
      border:1px solid #cfd4d8;
      background:#fff;
      border-radius:14px;
      padding:14px 14px;
      font:inherit;
      font-size:1rem;
      color:#1e242a;
      outline:none;
    }
    textarea{min-height:120px;resize:vertical}
    input:focus, textarea:focus, select:focus{
      border-color:var(--brand-slate);
      box-shadow:0 0 0 3px rgba(83,86,90,.12);
    }
    .nav{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:20px;
      justify-content:space-between;
    }
    .nav .btn{text-align:center}
    .section-card{
      border:1px solid #e3e6e9;
      border-radius:18px;
      padding:15px 14px;
      background:#fbfbfc;
      margin-bottom:12px;
    }
    .section-card h3{
      font-size:1.03rem;
      margin-bottom:12px;
    }
    .kv{display:grid;gap:8px}
    .kv-row{
      border-bottom:1px solid #eceef0;
      padding-bottom:8px;
      margin-bottom:2px;
    }
    .kv-row:last-child{border-bottom:none;padding-bottom:0}
    .kv-key{
      color:#5f6a74;
      font-size:.9rem;
      margin-bottom:3px;
    }
    .kv-val{
      color:#1d2328;
      font-weight:700;
      line-height:1.45;
      word-break:break-word;
    }
    .notice{
      border-left:4px solid var(--brand-yellow);
      background:#fff8db;
      border-radius:14px;
      padding:13px 13px 13px 15px;
      margin-top:14px;
    }
    .notice h3{margin:0 0 8px}
    .notice ul{margin:0;padding-left:18px}
    .notice li{margin:0 0 7px;line-height:1.45}
    .thankyou{text-align:center;padding-top:6px}
    .thankyou .sig{
      width:min(280px,76%);
      display:block;
      margin:12px auto 10px;
      height:auto;
    }
    .split{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .summary-action{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:12px;
    }
    @media (max-width:639px){
      .brand{
        padding:10px 10px 14px;
      }
      .brand .logo{
        width:min(110px,34vw);
        margin:6px auto 12px;
      }
      .brand h1{
        font-size:clamp(1.55rem, 6.8vw, 2.25rem);
      }
      .brand p{
        font-size:.95rem;
        line-height:1.38;
        max-width:320px;
      }
    }
    @media (min-width:640px){
      .page{padding:26px 16px 52px}
      .content{padding:28px 24px 22px}
      .summary-action{justify-content:space-between}
      .nav .btn{width:auto;min-width:140px}
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="shell">
      <div class="brand" id="brandHeader">
        <img src="SM Main Logo.png" alt="Stephanie Macnab Estate Agent" class="logo" />
        <h1>Property Information Form</h1>
        <p>A clean, mobile-friendly form to help us prepare your property for marketing, capture the information buyers usually ask for and reduce avoidable delays once the property is launched.</p>
      </div>

      <div class="card">
        <div class="topbar">
          <div id="stepLabel">Getting started</div>
          <div class="progress"><span id="progressBar"></span></div>
        </div>
        <div class="content" id="app"></div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "sm_property_information_form_v5";
    const SUBMISSION_EMAIL = "sales@stephaniemacnab.co.uk";
    const PRIVACY_URL = "https://www.stephaniemacnab.co.uk/privacy-policy/";
    const data = loadState();
    let screenId = hasPrefillParams() ? "address_check" : (data.__screenId || "welcome");
    function loadState(){
      try{
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      }catch(e){
        return {};
      }
    }

    function getQueryPrefill(){
      const params = new URLSearchParams(window.location.search);
    
      const address1 = (params.get("address1") || "").trim();
      const area = (params.get("area") || "").trim();
      const town = (params.get("town") || "").trim();
      const postcode = (params.get("postcode") || "").trim();
    
      let house = "";
      let street = "";
    
      if (address1) {
        const match = address1.match(/^(\S+)\s+(.+)$/);
        if (match) {
          house = match[1].trim();
          street = match[2].trim();
        } else {
          house = address1;
          street = "";
        }
      }
    
      return {
        address_house_number: house,
        address_street: street,
        address_area: area,
        town_city: town,
        postcode: postcode,
        declaration_name: params.get("name") || "",
        declaration_email: params.get("email") || "",
        declaration_mobile: params.get("mobile") || ""
      };
    }

    function applyQueryPrefill(){
      const prefill = getQueryPrefill();
    
      data.address_house_number = prefill.address_house_number || "";
      data.address_street = prefill.address_street || "";
      data.address_area = prefill.address_area || "";
      data.town_city = prefill.town_city || "";
      data.postcode = prefill.postcode || "";
      data.declaration_name = prefill.declaration_name || "";
      data.declaration_email = prefill.declaration_email || "";
      data.declaration_mobile = prefill.declaration_mobile || "";
    }

    function hasPrefillParams(){
      const params = new URLSearchParams(window.location.search);
      return !!(
        params.get("address1") ||
        params.get("area") ||
        params.get("town") ||
        params.get("postcode") ||
        params.get("name") ||
        params.get("email") ||
        params.get("mobile")
      );
    }
    
    function formattedAddress(){
      return [
        data.address_house_number,
        data.address_street,
        data.address_area,
        data.town_city,
        data.postcode
      ].filter(Boolean).join(", ");
    }

    applyQueryPrefill();

    const fieldLabels = {
      address_house_number: "House number / name",
      address_street: "Street",
      address_area: "Area",
      town_city: "Town or city",
      postcode: "Postcode",
      property_type: "Property type",
      property_type_other: "Other property type",
      tenure: "Tenure",
      acting_role: "Acting for",
      acting_role_other: "Other acting arrangement",
      number_of_owners: "Number of legal owners",
      legal_owner_names: "Legal owner names",
      is_legal_owner_respondent: "Are you one of the legal owners?",
      authority_type: "Legal authority",
      authority_type_other: "Other authority",
      authority_document_available: "Authority document available",
      vacant_or_occupied: "Occupancy status",
      tenant_details: "Tenancy details",
      onward_position: "Onward position",
      vacant_reason: "Reason property is vacant",
      vacant_reason_other: "Other vacant reason",
      council_tax_band: "Council Tax band",
      local_authority: "Local authority",
      parking: "Parking",
      parking_other: "Other parking",
      parking_basis: "Parking basis",
      access_type: "Access to property",
      garden_orientation: "Rear garden orientation",
      electricity_supply: "Electricity supply",
      electricity_meter_location: "Electricity meter location",
      electricity_meter_location_other: "Electricity meter location details",
      gas_supply: "Gas supply",
      gas_meter_location: "Gas meter location",
      gas_meter_location_other: "Gas meter location details",
      water_supply: "Water supply",
      drainage: "Drainage",
      water_meter: "Water meter",
      water_meter_location: "Water meter location",
      water_meter_location_other: "Water meter location details",
      water_stop_tap_location: "Internal stop tap location",
      utilities_issues: "Utility issues",
      utilities_issues_details: "Utility issue details",
      broadband: "Broadband",
      mobile_signal: "Mobile signal",
      construction_type: "Construction type",
      epc_available: "EPC available",
      smoke_co_alarms: "Smoke / CO alarms",
      heating_type: "Heating type",
      heating_type_other: "Other heating type",
      boiler_type: "Boiler type",
      boiler_location: "Boiler location",
      boiler_age: "Boiler age",
      boiler_serviced: "Boiler serviced annually",
      hot_water_cylinder: "Hot water cylinder",
      loft_present: "Is there a loft?",
      loft_boarded: "Loft boarded",
      loft_access: "Loft access",
      loft_light: "Loft light",
      flood_history: "Flooding history",
      flood_details: "Flood details",
      additional_location_risks: "Other location or environmental risks",
      additional_location_risks_details: "Other location or environmental risk details",
      structural_issues: "Structural issues",
      structural_details: "Structural details",
      knotweed: "Japanese knotweed",
      insurance_issues: "Insurance issues",
      insurance_issues_details: "Insurance issue details",
      neighbour_issues: "Neighbour issues",
      neighbour_issue_details: "Neighbour issue details",
      disputes_complaints: "Disputes or complaints",
      disputes_details: "Dispute details",
      listed_or_conservation: "Listed / conservation area",
      title_restrictions: "Title restrictions or easements",
      title_restrictions_details: "Title restriction details",
      covenant_restrictions: "Restrictions affecting use or alterations",
      covenant_restrictions_details: "Restriction details",
      rights_of_way: "Rights of way / shared access",
      rights_of_way_details: "Rights of way details",
      planning_works: "Major works / alterations",
      recent_upgrades: "Repairs / replacements / upgrades",
      recent_upgrades_details: "Repairs / upgrades details",
      planning_works_details: "Major works details",
      planning_works_approval: "Works approval status",
      planning_permission_docs: "Planning / building regs paperwork",
      guarantees_docs: "Guarantees / certificates",
      lease_years_remaining: "Lease years remaining",
      ground_rent: "Ground rent",
      service_charge: "Service charge",
      managing_agent: "Managing agent",
      major_works: "Major works expected",
      lease_restrictions: "Lease restrictions",
      solar_panels: "Solar panels",
      solar_panels_basis: "Solar panels ownership / agreement",
      ev_charger: "EV charger",
      alarm_cctv: "Alarm / CCTV",
      outbuildings: "Outbuildings / garden room",
      solicitor_details: "Solicitor details",
      declaration_name: "Your name",
      declaration_email: "Email address",
      declaration_mobile: "Mobile number",
      declaration_confirm: "Declaration confirmation"
    };

    const sectionTitles = {
      property: "Property details",
      ownership: "Ownership and authority",
      occupancy: "Occupancy and sale position",
      material: "Material information",
      utilities: "Services and utilities",
      viewing: "Viewing information",
      risk: "Risks, restrictions and works",
      leasehold: "Leasehold information",
      docs: "Documents and contacts"
    };

    const screens = [
      {
        id: "welcome",
        kind: "notice",
        section: "Getting started",
        title: "Before you begin",
        body: [
          "As professional estate agents, we are required to comply with current regulations and legislation relating to Material Information. That means we need to gather certain key details about your property before it is launched to the market.",
          "This form collects that essential information first, then moves on to a few practical details that help us with marketing, viewings and answering buyer questions.",
          "If you are unsure about anything, please choose Not sure or leave the field blank where that option is available."
        ],
        footerHtml: `Our privacy policy is available <a href="${PRIVACY_URL}" target="_blank" rel="noopener">here</a>.`,
        buttons: [
          { label: "Start new form", style: "primary", action: "startNew" },
          { label: "Resume saved form", style: "secondary", action: "resume" },
          { label: "Clear saved form", style: "ghost", action: "clear" }
        ]
      },
      {
        id: "consent",
        kind: "notice",
        section: "Privacy and consent",
        title: "A quick note on personal data",
        body: [
          "We are asking for personal information, ownership details and property information so we can prepare the file properly, market the property accurately and deal with buyer enquiries efficiently.",
          "The information may be shared within our team and, where needed, with appointed contractors or professional advisers involved in the sale process."
        ],
        footerHtml: `You can read our privacy policy <a href="${PRIVACY_URL}" target="_blank" rel="noopener">here</a>.`,
        buttons: [
          { label: "I understand, continue", style: "primary", action: "next" }
        ]
      },

      {
      id: "address_check",
        kind: "address_check",
        section: "property",
        title: "Please confirm the property address",
        showIf: d => !!(d.address_house_number && d.address_street && d.town_city && d.postcode)
      },

      { id:"address_house_number", kind:"text", section:"property", title:"Property address", label:"House number / name", placeholder:"For example, 12 or Rose Cottage", required:true },
      { id:"address_street", kind:"text", section:"property", title:"Property address", label:"Street", placeholder:"Street", required:true },
      { id:"address_area", kind:"text", section:"property", title:"Property address", label:"Area", placeholder:"Area or locality, if needed" },
      { id:"town_city", kind:"text", section:"property", title:"Town or city", label:"Town or city", placeholder:"Town or city", required:true },
      { id:"postcode", kind:"text", section:"property", title:"Postcode", label:"Postcode", placeholder:"Postcode", required:true },

      { id:"property_type", kind:"choice", section:"property", title:"What type of property is it?", options:["Detached house","Semi-detached house","Terraced house","Bungalow","Flat or apartment","Maisonette","Other","Not sure"] },
      { id:"property_type_other", kind:"text", section:"property", title:"Please add the property type", label:"Other property type", placeholder:"Brief description", showIf:d=>d.property_type==="Other" },
      { id:"tenure", kind:"choice", section:"property", title:"What is the tenure?", options:["Freehold","Leasehold","Share of freehold","Commonhold","Not sure"] },

      { id:"friendly_1", kind:"notice", section:"Material Information", title:"Material Information first", body:["The next section covers the key details we need in order to comply with current Material Information requirements before the property is marketed.","After that, we move on to a few more practical points that help with photography, brochure wording, viewings and buyer enquiries."], buttons:[{label:"Continue",style:"primary",action:"next"}] },

      { id:"acting_role", kind:"choice", section:"ownership", title:"Are you dealing with the sale on your own behalf or for someone else?", options:["On my own behalf","For a relative","For an estate","For a company or trust","Other"] },
      { id:"acting_role_other", kind:"text", section:"ownership", title:"Please add a short note", label:"Other arrangement", placeholder:"Brief details", showIf:d=>d.acting_role==="Other" },
      { id:"number_of_owners", kind:"choice", section:"ownership", title:"How many legal owners are there?", options:["1","2","3 or more","Not sure"] },
      { id:"legal_owner_names", kind:"textarea", section:"ownership", title:"Legal owner names", label:"Please list the legal owner or owners", placeholder:"Enter names on separate lines if easier", required:true },
      { id:"is_legal_owner_respondent", kind:"choice", section:"ownership", title:"Are you one of the legal owners?", options:["Yes","No","Not sure"] },
      { id:"authority_type", kind:"choice", section:"ownership", title:"What legal authority do you have to deal with the sale?", options:["Power of Attorney","Grant of Probate","Letters of Administration","Company authority","Trust authority","Authority not yet in place","Not sure","Other"], showIf:d=>d.acting_role!=="On my own behalf" || d.is_legal_owner_respondent==="No" },
      { id:"authority_type_other", kind:"text", section:"ownership", title:"Please add the authority type", label:"Other authority", placeholder:"Brief details", showIf:d=>d.authority_type==="Other" },
      { id:"authority_document_available", kind:"choice", section:"ownership", title:"Is the authority document available now?", options:["Yes","No","Not sure"], showIf:d=>!!d.authority_type && !["Authority not yet in place","Not sure"].includes(d.authority_type) },

      { id:"vacant_or_occupied", kind:"choice", section:"occupancy", title:"Is the property currently occupied?", options:["Owner occupied","Tenanted","Vacant","Part vacant / mixed use","Not sure"] },
      { id:"tenant_details", kind:"textarea", section:"occupancy", title:"Tenancy details", label:"Please add any tenancy details you know", placeholder:"Rent, tenancy type, deposit, notice position or anything else relevant", showIf:d=>["Tenanted","Part vacant / mixed use"].includes(d.vacant_or_occupied) },
      { id:"onward_position", kind:"choice", section:"occupancy", title:"Will the seller need an onward purchase?", options:["No onward chain","Will need to find somewhere","Already looking","Offer agreed on onward purchase","Already secured / moving into accommodation","Not sure"], showIf:d=>d.vacant_or_occupied!=="Vacant" },
      { id:"vacant_reason", kind:"choice", section:"occupancy", title:"Why is the property vacant?", options:["Probate","Already moved out","Second home","Investment property","Other","Not sure"], showIf:d=>d.vacant_or_occupied==="Vacant" },
      { id:"vacant_reason_other", kind:"text", section:"occupancy", title:"Please add a short note", label:"Reason property is vacant", placeholder:"Brief details", showIf:d=>d.vacant_reason==="Other" },

      { id:"council_tax_band", kind:"choice", section:"material", title:"Council Tax band", options:["A","B","C","D","E","F","G","H","Not sure"] },
      { id:"local_authority", kind:"choice", section:"material", title:"Local authority", options:["Sefton","West Lancashire","Liverpool City Council","Other","Not sure"] },
      { id:"parking", kind:"choice", section:"material", title:"Parking", options:["Driveway","Garage","Allocated space","On-street","Permit","No parking","Other","Not sure"] },
      { id:"parking_other", kind:"text", section:"material", title:"Please add parking details", label:"Other parking arrangement", placeholder:"Brief details", showIf:d=>d.parking==="Other" },
      { id:"parking_basis", kind:"choice", section:"material", title:"What is the legal basis of the parking, if known?", options:["Owned within title","Allocated","Shared","Informal / on-street","Not sure"], showIf:d=>["Driveway","Garage","Allocated space","Permit","Other"].includes(d.parking) },
      { id:"access_type", kind:"choice", section:"material", title:"How is the property accessed?", options:["Direct from a public highway","Via a shared or private road","Pedestrian access only","Not sure"] },
      { id:"garden_orientation", kind:"choice", section:"material", title:"Rear garden orientation, if known", options:["North","South","East","West","North-east","North-west","South-east","South-west","No rear garden","Not sure"] },
      { id:"construction_type", kind:"choice", section:"material", title:"Construction type, if known", options:["Standard construction","Non-standard construction","Not sure"] },
      { id:"epc_available", kind:"choice", section:"material", title:"Do you have an EPC, or have you previously had one?", options:["Yes","No","Not sure"] },

        function saveState(){
      data.__screenId = screenId;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function clearState(preserveScreen=false){
      const newScreen = preserveScreen ? screenId : "welcome";
      localStorage.removeItem(STORAGE_KEY);
      for(const key of Object.keys(data)){ delete data[key]; }
      screenId = newScreen;
      saveState();
      render();
    }

    function visibleScreens(){
      return screens.filter(s => !s.showIf || s.showIf(data));
    }

    function currentVisibleScreens(){
      return visibleScreens().filter(s => !["welcome","submitted"].includes(s.id));
    }

    function currentIndexInVisible(){
      return currentVisibleScreens().findIndex(s => s.id === screenId);
    }

    function goNext(){
      const current = screens.find(s => s.id === screenId);

      if(current && current.required){
        if((current.kind === "text" || current.kind === "textarea") && !String(data[current.id] || "").trim()){
          alert("Please complete this field before continuing.");
          return;
        }
        if(current.kind === "choice" && !String(data[current.id] || "").trim()){
          alert("Please select an option before continuing.");
          return;
        }
      }

      const vis = visibleScreens();
      const idx = vis.findIndex(s => s.id === screenId);
      if(idx >= 0 && idx < vis.length - 1){
        screenId = vis[idx + 1].id;
      }
      saveState();
      render();
    }

    function goPrev(){
      const vis = visibleScreens();
      const idx = vis.findIndex(s => s.id === screenId);
      if(idx > 0){
        screenId = vis[idx - 1].id;
      }
      saveState();
      render();
    }

    function setValue(id, value){
      data[id] = value;
      saveState();
    }

    function handleTextInput(id, el){
      if(id === "legal_owner_names"){
        const lines = el.value.split("\n").map(line =>
          line.replace(/\b[a-z]/g, c => c.toUpperCase())
        );
        el.value = lines.join("\n");
        data[id] = el.value;
      } else {
        data[id] = el.value;
      }
      saveState();
    }

    function startNew(){
      clearState(true);
      screenId = hasPrefillParams() ? "address_check" : "consent";
      applyQueryPrefill();
      saveState();
      render();
    }

    function resumeForm(){
      const stored = loadState();
      if(Object.keys(stored).length){
        Object.assign(data, stored);
        applyQueryPrefill();
        screenId = hasPrefillParams()
          ? "address_check"
          : (stored.__screenId && stored.__screenId !== "submitted" ? stored.__screenId : "consent");
      } else {
        applyQueryPrefill();
        screenId = hasPrefillParams() ? "address_check" : "consent";
      }
      saveState();
      render();
    }

    function ensureCurrentVisible(){
      const vis = visibleScreens();
      if(!vis.some(s => s.id === screenId)){
        const idx = screens.findIndex(s => s.id === screenId);
        let fallback = "summary";
        for(let i = idx - 1; i >= 0; i--){
          const candidate = screens[i];
          if(!candidate.showIf || candidate.showIf(data)){
            fallback = candidate.id;
            break;
          }
        }
        screenId = fallback;
        saveState();
      }
    }

    function escapeHtml(str){
      return String(str || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function valueForDisplay(id){
      const v = data[id];
      if(v === undefined || v === null || v === "") return "—";
      return String(v).replace(/\n/g, "<br>");
    }

    function nextButtonDisabled(){
      return false;
    }

    function renderNotice(screen){
      const buttons = (screen.buttons || []).map(b => `
        <button class="btn ${b.style || 'ghost'}" onclick="handleAction('${b.action}')">${escapeHtml(b.label)}</button>
      `).join("");
      return `
        <div class="eyebrow">${escapeHtml(screen.section || "Information")}</div>
        <h2>${escapeHtml(screen.title)}</h2>
        ${screen.body.map(p => `<p>${escapeHtml(p)}</p>`).join("")}
        ${screen.footerHtml ? `<p class="tiny">${screen.footerHtml}</p>` : ""}
        <div class="btn-grid">${buttons}</div>
      `;
    }

    function renderAddressCheck(screen){
      return `
        <div class="eyebrow">${escapeHtml(sectionTitles[screen.section] || screen.section)}</div>
        <h2>${escapeHtml(screen.title)}</h2>
        <div class="section-card">
          <div class="kv">
            <div class="kv-row">
              <div class="kv-key">Property address</div>
              <div class="kv-val">${escapeHtml(formattedAddress() || "—")}</div>

    function renderChoice(screen){
      return `
        <div class="eyebrow">${escapeHtml(sectionTitles[screen.section] || screen.section)}</div>
        <h2>${escapeHtml(screen.title)}</h2>
        <div class="btn-grid">
          ${screen.options.map(opt => `
            <button class="btn" onclick="chooseOption('${screen.id}', '${escapeJs(opt)}')">${escapeHtml(opt)}</button>
          `).join("")}
        </div>
        <div class="nav">
          <button class="btn ghost" onclick="goPrev()">Back</button>
        </div>
      `;
    }

    function renderText(screen){
      const val = data[screen.id] || "";
      const isTextArea = screen.kind === "textarea";
      return `
        <div class="eyebrow">${escapeHtml(sectionTitles[screen.section] || screen.section)}</div>
        <h2>${escapeHtml(screen.title)}</h2>
        <div class="field">
          <label for="${escapeHtml(screen.id)}">${escapeHtml(screen.label || screen.title)}</label>
          ${isTextArea
            ? `<textarea id="${escapeHtml(screen.id)}"
                placeholder="${escapeHtml(screen.placeholder || '')}"
                ${screen.id === "legal_owner_names" ? 'style="text-transform:capitalize"' : ""}
                oninput="handleTextInput('${screen.id}', this)">${escapeHtml(val)}</textarea>`
            : `<input id="${escapeHtml(screen.id)}"
                type="text"
                placeholder="${escapeHtml(screen.placeholder || '')}"
                value="${escapeHtml(val)}"
                ${screen.id === "legal_owner_names" ? 'style="text-transform:capitalize"' : ""}
                oninput="handleTextInput('${screen.id}', this)"
                onkeydown="handleKeyNext(event, '${screen.id}')"
                enterkeyhint="next"
              />`
          }
        </div>
        ${screen.required ? `<p class="tiny">This answer is required.</p>` : `<p class="tiny">Leave blank if not known.</p>`}
        <div class="nav">
          <button class="btn ghost" onclick="goPrev()">Back</button>
          <button class="btn primary" onclick="goNext()" ${nextButtonDisabled(screen) ? "disabled" : ""}>Next</button>
        </div>
      `;
    }

    function handleKeyNext(e, id){
      if(e.key === "Enter"){
        e.preventDefault();
    
        const current = screens.find(s => s.id === id);
    
        if(current && current.required){
          if(!String(data[id] || "").trim()){
            alert("Please complete this field before continuing.");
            return;
          }
        }
    
        goNext();
      }
    }
    
    function groupSectionRows(fieldIds){
      const rows = fieldIds
        .filter(id => {
          const s = screens.find(x => x.id === id);
          if(!s) return false;
          if(s.showIf && !s.showIf(data)) return false;
          const val = data[id];
          return val !== undefined && val !== null && String(val).trim() !== "";
        })
        .map(id => `
          <div class="kv-row">
            <div class="kv-key">${escapeHtml(fieldLabels[id] || id)}</div>
            <div class="kv-val">${valueForDisplay(id)}</div>
          </div>
        `).join("");
      return rows || `<div class="kv-row"><div class="kv-key">No information added</div><div class="kv-val">—</div></div>`;
    }

    function screenIdForSection(sectionKey){
      return screens.find(s => s.section === sectionKey && s.kind !== "notice")?.id || "consent";
    }

    function editSection(sectionKey){
      screenId = screenIdForSection(sectionKey);
      saveState();
      render();
    }

    function generateFlags(){
      const flags = [];
      if((data.acting_role === "For an estate" || data.acting_role === "For a relative" || data.is_legal_owner_respondent === "No") &&
         (!data.authority_type || data.authority_type === "Authority not yet in place" || data.authority_document_available === "No" || data.authority_document_available === "Not sure")){
        flags.push("Authority to act should be checked before the file progresses.");
      }
      if(["Leasehold","Share of freehold"].includes(data.tenure) &&
         (!data.lease_years_remaining || !data.service_charge || !data.ground_rent)){
        flags.push("Leasehold information appears incomplete and should be checked with the client or solicitor.");
      }
      if(data.parking && ["Driveway","Garage","Allocated space","Permit","Other"].includes(data.parking) &&
         (!data.parking_basis || data.parking_basis === "Not sure")){
        flags.push("Parking exists but the legal basis should be checked.");
      }
      if(data.access_type === "Via a shared or private road"){
        flags.push("Access is via a shared or private road. Check rights and maintenance responsibility.");
      }
      if(data.construction_type === "Non-standard construction"){
        flags.push("Construction type disclosed as non-standard. Review before marketing particulars are finalised.");
      }
      if(data.utilities_issues === "Yes"){
        flags.push("Utility issue disclosed. Review before marketing wording is finalised.");
      }
      if(data.planning_works === "Yes" && ["No","Not sure"].includes(data.planning_works_approval || "")){
        flags.push("Major works reported but approval status is unclear or negative. Review before marketing.");
      }
      if(data.planning_works === "Yes" && ["No","Not sure"].includes(data.planning_permission_docs || "")){
        flags.push("Major works reported but planning / building regulations paperwork may need checking.");
      }
      if(data.planning_works === "Yes" && ["No","Not sure"].includes(data.guarantees_docs || "")){
        flags.push("Major works reported but guarantees, certificates or warranties may need checking.");      }
      if(data.recent_upgrades === "Yes"){
        flags.push("Recent repairs or upgrades disclosed. Check for supporting information where relevant.");
      }
      if(data.insurance_issues === "Yes"){
        flags.push("Insurance issue disclosed. Clarify nature and current position.");
      }
      if(data.neighbour_issues === "Yes" || data.disputes_complaints === "Yes"){
        flags.push("Neighbour issue or dispute disclosed. Review before marketing wording is finalised.");
      }
      if(data.title_restrictions === "Yes" || data.rights_of_way === "Yes" || data.covenant_restrictions === "Yes"){
        flags.push("Title, access or covenant issue disclosed. Check title and solicitor input.");
      }
      if(data.flood_history === "Yes" || data.additional_location_risks === "Yes"){
        flags.push("Environmental or location risk disclosed. Clarify extent and any supporting information.");
      }
      if(data.structural_issues === "Yes"){
        flags.push("Structural issue disclosed. Check details and supporting paperwork if available.");
      }
      if(data.vacant_or_occupied === "Tenanted" || data.vacant_or_occupied === "Part vacant / mixed use"){
        flags.push("Tenancy position should be reviewed before marketing to confirm sale strategy.");
      }
      if(data.onward_position === "Will need to find somewhere" || data.onward_position === "Already looking"){
        flags.push("Seller has an onward dependency. Sales progression and marketing messaging may need care.");
      }
      if(data.knotweed === "Yes" || data.knotweed === "Not sure"){
        flags.push("Japanese knotweed response should be checked.");
      }
      if(data.listed_or_conservation === "Listed" || data.listed_or_conservation === "Both" || data.listed_or_conservation === "Conservation area"){
        flags.push("Listed or conservation area status may affect marketing wording and works history.");
      }
      if(data.solar_panels === "Yes" && (!data.solar_panels_basis || data.solar_panels_basis === "Not sure")){
        flags.push("Solar panels disclosed. Ownership or agreement basis should be confirmed.");
      }
      if(data.smoke_co_alarms === "No"){
        flags.push("Smoke / CO alarms noted as not installed. Review whether any comment is needed before launch.");
      }
      if(data.declaration_confirm === "I am not able to confirm this"){
        flags.push("Seller has not confirmed the declaration. Manual review required before marketing.");
      }
      return flags;
    }

    function buildReport(){
      const flags = generateFlags();
      const lines = [];
      const join = (...parts) => parts.filter(Boolean).join(", ");

      lines.push("PROPERTY INFORMATION FORM");
      lines.push("");
      lines.push("PROPERTY");

      if(["Leasehold","Share of freehold"].includes(data.tenure)){
        lines.push("LEASEHOLD INFORMATION");

        lines.push(`Service charge: ${data.service_charge || "—"}`);

      lines.push("DOCUMENTS AND CONTACTS");

      lines.push("FLAGS FOR FOLLOW-UP");
      if(flags.length){
        flags.forEach(flag => lines.push(`- ${flag}`));
      } else {
        lines.push("- No automatic follow-up flags were triggered from the answers given.");
      }
      lines.push("");
      lines.push("End of report");

      return lines.join("\n");

    function cleanOneLine(v){
      return String(v || "").replace(/\s*\n\s*/g, " | ").trim();
    }

    function submitForm(){
      if(!String(data.declaration_name || "").trim() || !String(data.declaration_email || "").trim()){
        alert("Please add your name and email address before submitting.");
        editSection("docs");
        return;
      }
      if(data.declaration_confirm === "I am not able to confirm this"){
        const proceed = confirm("You have indicated that you are not able to confirm the declaration. Do you still want to continue and send the form for manual review?");
        if(!proceed) return;
      }
      const subject = `Property Information Form - ${cleanOneLine([formattedAddress()].filter(Boolean).join(", ")) || "Submission"}`;
      const body = buildReport();
      const mailto = `mailto:${encodeURIComponent(SUBMISSION_EMAIL)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      window.location.href = mailto;
      localStorage.removeItem(STORAGE_KEY);
      screenId = "submitted";
      render();
    }

    function handleAction(action){
      if(action === "startNew") startNew();
      if(action === "resume") resumeForm();
      if(action === "clear"){
        const ok = confirm("Clear the saved answers on this device and return to the start?");
        if(ok) clearState();
      }
      if(action === "next") goNext();

      if(action === "addressConfirmYes"){
        screenId = "property_type";
        saveState();
        render();
      }

      if(action === "addressConfirmNo"){
        screenId = "address_house_number";
        saveState();
        render();
      }
    }

    function chooseOption(id, value){
      setValue(id, value);
      goNext();
    }

    function escapeJs(str){
      return String(str).replaceAll("\\","\\\\").replaceAll("'","\\'");
    }

    function renderSubmitted(){
  return `
    <div class="thankyou">
      <div class="eyebrow">Thank you</div>
      <h2>Thank you for completing the form</h2>

      <p>We hope that was reasonably straightforward. Getting this information in place early helps us prepare the file properly and answer buyer questions more efficiently once marketing begins.</p>

      <p><strong>Our onboarding team will be in touch shortly, if they haven’t already, to arrange access for viewings and discuss next steps.</strong></p>

      <img class="sig" src="Steph & Simon Sig.jpeg" alt="Steph and Simon signature" />

      <p><strong>Thank you for your patience,<br>from Steph, Simon and the team.</strong></p>

      <div class="btn-grid">
        <button class="btn primary" onclick="window.close()">Close this window</button>
      </div>

      <p class="tiny">If this window does not close automatically, you can now close this browser tab.</p>
    </div>
  `;
}

    function render(){
      ensureCurrentVisible();
      const app = document.getElementById("app");
      const label = document.getElementById("stepLabel");
      const bar = document.getElementById("progressBar");
      const brandHeader = document.getElementById("brandHeader");
      const screen = screens.find(s => s.id === screenId) || screens[0];

      if (["welcome", "consent"].includes(screenId)) {
        brandHeader.classList.remove("compact");
      } else {
        brandHeader.classList.add("compact");
      }

      if(screen.kind === "submitted"){
        label.textContent = "Complete";
        bar.style.width = "100%";
        app.innerHTML = renderSubmitted();
        return;
      }

      const vis = currentVisibleScreens();
      const idx = currentIndexInVisible();
      const pct = idx >= 0 ? Math.round(((idx + 1) / vis.length) * 100) : 0;
      label.textContent = screen.kind === "summary" ? "Final review" : `Step ${Math.max(idx + 1, 0)} of ${vis.length}`;
      bar.style.width = `${pct}%`;

      if(screen.kind === "notice"){
        app.innerHTML = renderNotice(screen);
        return;
      }
      if(screen.kind === "address_check"){
        app.innerHTML = renderAddressCheck(screen);
        return;
      }
      if(screen.kind === "choice"){
        app.innerHTML = renderChoice(screen);
        return;
      }
      if(screen.kind === "text" || screen.kind === "textarea"){
        app.innerHTML = renderText(screen);
      
        setTimeout(() => {
          const el = document.getElementById(screen.id);
          if (el) el.focus();
        }, 0);

        return;
      }
      
      if(screen.kind === "summary"){
        app.innerHTML = renderSummary();
      }
    }

    saveState();
    render();
  </script>
